name: Build & Storybook Verification

on:
  push:
    branches: [main, develop, feat/*, chore/*]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint code
        run: pnpm lint
      
      - name: Build Next.js app
        run: pnpm build
      
      - name: Build Storybook
        run: pnpm build-storybook --quiet
      
      - name: Verify Storybook output
        run: test -d storybook-static && echo "✓ Storybook built successfully"
        